[project]
name = "vibe-chicken-backend"
version = "0.1.0"
description = "Backend for the chicken farm tracking app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "bcrypt>=4.2",
    "itsdangerous>=2.2",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8",
]
