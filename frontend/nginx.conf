# nginx внутри контейнера фронтенда.
# Приложение публикуется по пути /chicken за системным nginx с SSL
# (см. deploy/nginx-system.conf.example и docs/deploy.md):
# системный nginx проксирует весь префикс на этот контейнер целиком,
# здесь он разбирается на статику и API.

server {
    listen 80;
    server_name _;

    # Редиректы относительные: системный nginx с SSL может слушать и :80,
    # абсолютный http-Location не должен уводить браузер с https
    absolute_redirect off;

    # API: снимаем префикс /chicken и отдаём FastAPI
    location /chicken/api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Статика + SPA-роуты (/history, /settings и т.п.) → index.html
    location /chicken/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ /chicken/index.html;
    }

    # /chicken без слэша → /chicken/
    location = /chicken {
        return 301 /chicken/;
    }
}
